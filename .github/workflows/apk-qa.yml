name: Android APK Automated QA Pipeline

on:
  push:
  pull_request:

jobs:
  test-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run App Build & Syntax Check
        run: npm run build --if-present

      - name: Run Automated Android Unit & Integration Tests
        run: npm run test --if-present

      - name: Execute Android APK Test Engine
        run: node server.js & sleep 3 && curl http://localhost:5000/api/health

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: apk-qa-report
          path: uploads/
          retention-days: 30
